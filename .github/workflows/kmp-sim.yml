name: kmp-sim
run-name: kmp-sim ${{ inputs.session }} · ${{ inputs.minutes }}m

on:
  workflow_dispatch:
    inputs:
      session:
        description: Session id
        required: true
      gate_token:
        description: Shared secret
        required: true
      minutes:
        description: How long to hold the stream open
        default: "30"
      cache:
        description: Use the Gradle cache
        default: true
        type: boolean

permissions:
  contents: read
  statuses: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: kmp-sim/${{ inputs.session }}
      GATE_PORT: "3199"
      STREAM_PORT: "3200"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle cache
        if: inputs.cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: kmp-sim-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}

      - name: Build Android App
        run: |
          chmod +x gradlew
          ./gradlew :app:androidApp:assembleDebug

      - name: Start Auth Gate
        env:
          KMP_SIM_GATE_TOKEN: ${{ inputs.gate_token }}
          KMP_SIM_TARGET_PORT: ${{ env.STREAM_PORT }}
          KMP_SIM_GATE_PORT: ${{ env.GATE_PORT }}
        run: |
          nohup node .github/kmp-sim/gate.cjs > gate.log 2>&1 &
          disown

      - name: Open tunnel and publish URL
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url "http://127.0.0.1:$GATE_PORT" --logfile cloudflared.log > /dev/null 2>&1 &
          disown

          TUNNEL=""
          for _ in $(seq 1 60); do
            TUNNEL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1 || true)
            [ -n "$TUNNEL" ] && break
            sleep 2
          done
          [ -n "$TUNNEL" ] || { echo "cloudflared never reported a URL"; exit 1; }

          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f "context=$STATUS_CONTEXT" \
            -f "target_url=$TUNNEL/__kmp-sim/healthz?k=${{ inputs.gate_token }}" \
            -f "description=stream live; hold for ${{ inputs.minutes }}m"

      - name: Start Android stream
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            APK=$(find . -type f -name "*-debug.apk" | head -1)
            if [ -z "$APK" ]; then
              echo "No debug APK found"
              find . -type f -name "*.apk"
              exit 1
            fi
            echo "Installing APK: $APK"
            adb install -r "$APK"

            adb shell monkey -p sl.volatio.iossimtest -c android.intent.category.LAUNCHER 1

            node -e "
              const { execSync } = require('child_process');
              const http = require('http');
              let frame = Buffer.alloc(0);
              setInterval(() => {
                try { frame = execSync('adb exec-out screencap -p', {maxBuffer:10*1024*1024}); } catch(e) {}
              }, 200);
              http.createServer((req,res) => {
                res.writeHead(200,{'Content-Type':'multipart/x-mixed-replace;boundary=frame','Cache-Control':'no-cache'});
                const iv = setInterval(() => {
                  if(frame.length){
                    res.write('--frame\\r\\nContent-Type:image/png\\r\\n\\r\\n');
                    res.write(frame);
                    res.write('\\r\\n');
                  }
                },200);
                req.on('close',()=>clearInterval(iv));
              }).listen(process.env.STREAM_PORT||3200,()=>console.log('stream ready'));
            " &

            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:${STREAM_PORT}/ > /dev/null 2>&1 && break
              sleep 2
            done
            echo "stream started"

            for i in $(seq 1 $(( ${{ inputs.minutes }} * 6 ))); do
              curl -fsS -o /dev/null "http://127.0.0.1:$STREAM_PORT/"
              sleep 10
            done

      - name: Mark session ended
        if: always()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f "context=$STATUS_CONTEXT" \
            -f "description=session ended" || true
