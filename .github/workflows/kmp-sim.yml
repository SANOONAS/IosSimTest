# kmp-sim-template-version: 1
name: kmp-sim
run-name: kmp-sim ${{ inputs.session }} · ${{ inputs.platform }} · ${{ inputs.minutes }}m

on:
  workflow_dispatch:
    inputs:
      session:
        description: Session id
        required: true
      gate_token:
        description: Shared secret
        required: true
      platform:
        description: ios or android
        default: "android"
      minutes:
        description: How long to hold the stream open
        default: "30"
      fingerprint:
        description: Native build fingerprint
        default: ""
      runner:
        description: Runner label
        default: "ubuntu-latest"

permissions:
  contents: read
  statuses: write

jobs:
  stream:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: kmp-sim/${{ inputs.session }}
      GATE_PORT: "3199"
      STREAM_PORT: "3200"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache build artifacts
        uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: |
            app/shared/build
            app/androidApp/build
            app/iosApp/build
          key: kmp-sim-build-${{ inputs.platform }}-${{ inputs.fingerprint }}

      - name: Build Shared (XCFramework)
        if: inputs.platform == 'ios' && steps.build-cache.outputs.cache-hit != 'true'
        run: ./gradlew :app:shared:assembleXCFramework

      - name: Build iOS App
        if: inputs.platform == 'ios' && steps.build-cache.outputs.cache-hit != 'true'
        run: |
          xcodebuild \
            -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Android App
        if: inputs.platform == 'android' && steps.build-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:androidApp:assembleDebug

      - name: Save build to cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/shared/build
            app/androidApp/build
            app/iosApp/build
          key: kmp-sim-build-${{ inputs.platform }}-${{ inputs.fingerprint }}

      - name: Install aapt
        if: inputs.platform == 'android'
        run: sudo apt-get install -y aapt

      - name: Enable KVM
        if: inputs.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Emulator and Stream (Android)
        if: inputs.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            echo "=== Emulator is ready ==="
            adb shell input keyevent 82

            APK=$(find . -name "*.apk" -path "*/androidApp/*" -path "*/debug/*" | head -1)
            echo "APK: $APK"
            adb install -r "$APK"

            PACKAGE=$(aapt dump badging "$APK" | grep package | awk -F"'" '{print $2}')
            echo "Package: $PACKAGE"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1

            sleep 3

            # Start MJPEG stream via adb screencap loop
            node -e "
              const { exec, execSync } = require('child_process');
              const http = require('http');
              let frame = Buffer.alloc(0);

              function captureFrame() {
                try {
                  frame = execSync('adb exec-out screencap -p', { maxBuffer: 10*1024*1024 });
                } catch(e) {}
              }

              setInterval(captureFrame, 200);
              captureFrame();

              http.createServer((req, res) => {
                res.writeHead(200, {
                  'Content-Type': 'multipart/x-mixed-replace; boundary=frame',
                  'Cache-Control': 'no-cache',
                  'Connection': 'keep-alive'
                });
                const iv = setInterval(() => {
                  if (frame.length) {
                    res.write('--frame\\r\\nContent-Type: image/png\\r\\n\\r\\n');
                    res.write(frame);
                    res.write('\\r\\n');
                  }
                }, 200);
                req.on('close', () => clearInterval(iv));
              }).listen(3200, () => console.log('Stream ready on 3200'));
            " &

            sleep 5
            echo "Stream started"

            # Start gate
            KMP_SIM_GATE_TOKEN="${{ inputs.gate_token }}" \
            KMP_SIM_TARGET_PORT=3200 \
            KMP_SIM_GATE_PORT=3199 \
            node .github/kmp-sim/gate.cjs &

            sleep 2

            # Tunnel
            curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x cloudflared
            ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3199 --logfile cloudflared.log &

            sleep 10
            TUNNEL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1)
            echo "Tunnel: $TUNNEL"

            gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=success \
              -f "context=$STATUS_CONTEXT" \
              -f "target_url=${TUNNEL}?k=${{ inputs.gate_token }}" \
              -f "description=Android stream live"

            sleep $(( ${{ inputs.minutes }} * 60 ))

      - name: Run Simulator and Stream (iOS)
        if: inputs.platform == 'ios'
        run: |
          # Boot simulator, install app, and stream using serve-sim or equivalent
          # Mock holding for now
          sleep $(( ${{ inputs.minutes }} * 60 ))

      - name: Mark session ended
        if: always()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f "context=$STATUS_CONTEXT" \
            -f "description=session ended" || true
