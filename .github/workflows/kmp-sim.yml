# kmp-sim-template-version: 2
name: kmp-sim
run-name: 'kmp-sim #${{ github.run_number }} · ${{ inputs.minutes }}m'

on:
  workflow_dispatch:
    inputs:
      device:
        description: iOS Simulator device name
        default: iPhone 17 Pro
        type: string
      minutes:
        description: How long to hold the stream open
        default: "30"
        type: string
      cache:
        description: Use the Gradle cache
        default: true
        type: boolean

permissions:
  contents: read
  statuses: write

jobs:
  stream:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: kmp-sim/${{ github.run_id }}-${{ github.run_attempt }}
      GATE_PORT: "3199"
      STREAM_PORT: "3200"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        if: inputs.cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: kmp-sim-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}

      - name: Select and boot iOS Simulator
        id: simulator
        env:
          DEVICE_NAME: ${{ inputs.device }}
        run: |
          DEVICE_UDID="$(xcrun simctl list devices available --json | python3 -c '
          import json, os, sys
          name = os.environ["DEVICE_NAME"]
          devices = json.load(sys.stdin)["devices"]
          available = [device for runtime in devices.values() for device in runtime if device["isAvailable"]]
          matches = [device for device in available if device["name"] == name]
          if not matches:
              print(f"No available iOS Simulator named {name!r}", file=sys.stderr)
              print("Available iPhone simulators:", file=sys.stderr)
              for device in available:
                  if device["name"].startswith("iPhone"):
                      print("  " + device["name"], file=sys.stderr)
              sys.exit(1)
          print(matches[0]["udid"])
          ')"
          echo "udid=$DEVICE_UDID" >> "$GITHUB_OUTPUT"
          DEVICE_STATE="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          udid = sys.argv[1]
          devices = json.load(sys.stdin)["devices"]
          print(next(device["state"] for runtime in devices.values() for device in runtime if device["udid"] == udid))
          ' "$DEVICE_UDID")"
          if [ "$DEVICE_STATE" != "Booted" ]; then
            xcrun simctl boot "$DEVICE_UDID"
          fi
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_UDID"

      - name: Build iOS app
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          chmod +x gradlew
          xcodebuild \
            -project app/iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Generate simulator access token
        id: access
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Start iOS Simulator stream
        env:
          KMP_SIM_GATE_TOKEN: ${{ steps.access.outputs.token }}
          KMP_SIM_MINUTES: ${{ inputs.minutes }}
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: bash .github/kmp-sim/stream.sh

      - name: Mark session ended
        if: always()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f "context=$STATUS_CONTEXT" \
            -f "description=session ended" || true
