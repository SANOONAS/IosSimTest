# kmp-sim-template-version: 2
name: kmp-sim
run-name: kmp-sim ${{ inputs.session }} · ${{ inputs.minutes }}m

on:
  workflow_dispatch:
    inputs:
      session:
        description: Session id
        required: true
      gate_token:
        description: Shared secret
        required: true
      minutes:
        description: How long to hold the stream open
        default: "30"
      cache:
        description: Use the Gradle cache
        default: true
        type: boolean

permissions:
  contents: read
  statuses: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: kmp-sim/${{ inputs.session }}
      GATE_PORT: "3199"
      STREAM_PORT: "3200"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle cache
        if: inputs.cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: kmp-sim-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}

      - name: Build Android App
        run: |
          chmod +x gradlew
          ./gradlew :app:androidApp:assembleDebug

      - name: Start Android stream
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KMP_SIM_GATE_TOKEN: ${{ inputs.gate_token }}
          KMP_SIM_MINUTES: ${{ inputs.minutes }}
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          script: sh .github/kmp-sim/stream.sh

      - name: Mark session ended
        if: always()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f "context=$STATUS_CONTEXT" \
            -f "description=session ended" || true
